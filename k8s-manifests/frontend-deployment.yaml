apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: default
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          #image: rafaelvzago/fortune-frontend:1.0
          image: ghcr.io/bsmiquelini/fortune-cookie-frontend:argocd-eedbd85
          ports:
            - containerPort: 80
